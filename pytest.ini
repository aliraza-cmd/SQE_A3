[pytest]
testpaths = test_cases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src
addopts = -v -ra
markers =
    order: Test execution order
    email: Email validation test suite
    ip: IP address validation test suite
    url: URL validation test suite
    csv: External CSV data-driven test suite
    ecp: Equivalence Class Partitioning tests
    bva: Boundary Value Analysis tests
    smoke: Quick sanity smoke tests
    regression: Full regression test suite